name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Prüfen, testen, bauen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typen prüfen
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit-Tests
        run: npm test

      - name: Hilfe-Check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: npm run check:help

      - name: Bauen
        run: npm run build

      - name: Native Module für Electron bauen
        run: npx electron-builder install-app-deps

      - name: Oberflächentests (Electron)
        run: |
          npx playwright install-deps chromium
          xvfb-run -a npm run test:e2e

      - name: Screenshots und Testbericht
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      # Artefakte sind von manchen Arbeitsumgebungen aus nicht erreichbar: Screenshots zusätzlich als Zweig screens/<Zweig>
      - name: Screenshots in Zweig screens/…
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          [ -d test-results/screens ] || exit 0
          mkdir -p /tmp/screens && cp test-results/screens/*.png /tmp/screens/ && cd /tmp/screens
          git init -q -b screens
          git add .
          git -c user.name=movue-ci -c user.email=ci@example.invalid commit -qm "Screenshots ${{ github.run_id }} (${{ github.event.pull_request.head.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/screens/${{ github.head_ref }}
