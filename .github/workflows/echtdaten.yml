name: Echtdaten

# Importiert die echte Filmliste vom Server: bei Änderungen am Import und einmal pro Woche,
# damit Formatänderungen bei MediathekView früh auffallen.
on:
  pull_request:
    paths:
      - 'src/main/filmliste/**'
      - 'src/main/index/**'
      - 'src/main/genre/**'
      - 'src/shared/sender.ts'
      - 'tests/echt/**'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      nur:
        description: 'Nur diese Datei ausführen (z. B. scripts/metadaten/baue.ts)'
        required: false
        default: ''

jobs:
  import:
    name: Echte Filmliste importieren
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --config vitest.echt.config.ts
        env:
          ECHT_NUR: ${{ inputs.nur || '' }}
          MOVUE_META_MINUTEN: '12'
      - name: Audit-Dumps hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit
          path: test-results/audit
          if-no-files-found: ignore
          retention-days: 14
      # Artefakte sind von manchen Arbeitsumgebungen aus nicht erreichbar: Audit-Dumps zusätzlich als Zweig audit/daten
      - name: Audit-Dumps in Zweig audit/daten
        if: always() && startsWith(inputs.nur, 'tests/echt/audit')
        run: |
          mkdir -p /tmp/daten
          cd test-results/audit
          split -b 40m filme.jsonl.gz /tmp/daten/filme.jsonl.gz.teil-
          cp buendel.json buendel.csv meta.json /tmp/daten/
          cd /tmp/daten
          git init -q -b daten
          git add .
          git -c user.name=movue-ci -c user.email=ci@example.invalid commit -qm "Audit-Dumps ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/audit/daten
